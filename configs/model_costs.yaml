# Global LLM cost table — $ per MILLION tokens (in / out / cached_in).
#
# Every model a run uses MUST have an entry: the LLM proxy refuses calls
# for unlisted models (HTTP 400, flag llm_model_unconfigured) and the
# launch entrypoints fail fast. Booked cost is computed from THIS file —
# never from a provider price table that can drift under us (litellm
# fetches its table from GitHub at import time; gpt-5.6-luna moved
# 1.00 -> 0.20 $/Mtok in Aug 2026 with no local trace).
#
# Companion table: configs/model_limits.yaml (context/output tokens per
# model) — OpenCode episodes refuse a model missing there.
#
# Keys are bare model names, provider-free: the same model billed the
# same whether it is reached via `openai:` or `openrouter:` (the
# api-provider prefix of --model never appears here). cached_in is the
# prompt-cache read rate; omit it to bill cached tokens at the full
# input rate. The per-call provider-issued bill is logged alongside the
# booked cost (ledger `cost_provider`) — watch early runs for drift and
# update this file deliberately.
#
# Sources: OpenAI rows pinned 2026-08-20 from litellm's price table
# (cross-checked against platform.openai.com/pricing); OpenRouter rows
# pinned 2026-08-20 from GET openrouter.ai/api/v1/models.

models:
  gpt-5.6-luna:  {in: 0.20, out: 1.20, cached_in: 0.02}
  gpt-5.6-terra: {in: 2.00, out: 12.00, cached_in: 0.20}
  gpt-5.6-sol:   {in: 5.00, out: 30.00, cached_in: 0.50}
  gpt-5.4:       {in: 2.50, out: 15.00, cached_in: 0.25}
  gpt-5.4-mini:  {in: 0.75, out: 4.50, cached_in: 0.075}
  deepseek/deepseek-v4-pro: {in: 1.60, out: 3.20, cached_in: 0.135}
  moonshotai/kimi-k3:       {in: 3.00, out: 15.00, cached_in: 0.30}
  google/gemini-3.5-flash-lite: {in: 0.30, out: 2.50, cached_in: 0.03}  # pinned 2026-08-22 (user-supplied)
  # --- 2026-08-22 batch, user-supplied rates (canonical OpenRouter ids) ---
  google/gemini-3.5-flash:      {in: 1.50, out: 9.00, cached_in: 0.15}
  deepseek/deepseek-v4-flash:   {in: 0.22, out: 0.66, cached_in: 0.022}  # "DeepSeek V4 Flash 0423"; OR lists 0.059/0.012/0.117
  moonshotai/kimi-k2.6:         {in: 0.95, out: 4.00, cached_in: 0.16}   # OR lists 0.541/0.091/2.28
  anthropic/claude-haiku-4.5:   {in: 1.00, out: 5.00, cached_in: 0.10}
  z-ai/glm-5.2:                 {in: 1.40, out: 4.40, cached_in: 0.26}   # OR lists 0.966/0.193/3.036 (1.40/0.26/4.40 is the :batch row)
  qwen/qwen3.7-plus:            {in: 0.32, out: 1.28, cached_in: 0.064}
  minimax/minimax-m3:           {in: 0.30, out: 1.20, cached_in: 0.06}
  openai/gpt-5.6-luna:  {in: 0.20, out: 1.20, cached_in: 0.02}
  openai/gpt-5.6-terra:  {in: 2.00, out: 12.00, cached_in: 0.20}
